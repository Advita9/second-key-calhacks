version: evalerr
rules:
  - id: D-01
    when: beneficiary.on_mule_list
    outcome: DENY
  - id: H-99
    # passes the load-time smoke env (amount 100) but divides by zero for amount 800000
    when: 1 / (amount_cents - 800000) > 0
    outcome: HOLD
  - id: A-01
    when: beneficiary.is_known_biller and amount_cents <= known_biller_cap_cents
    outcome: ALLOW
default: HOLD
precedence: [DENY, HOLD, ALLOW]
